    <div class="form-group">
      <label>{{ localize "Rotation" }} <span class="units">({{ localize "Degrees" }})</span></label>

        <range-picker id="lightmaskrotation" class="lightmask" name="flags.lightmask.rotation" value={{source.flags.lightmask.rotation}} min="0" max="360" step="1"></range-picker>
      </div>
    </div>

{{> "modules/lightmask/templates/lightmask-source-config-partial.html"}}

</section>
